name: Configure relaxpic.cn routing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Check configuration update logic
        run: python3 .github/scripts/configure_routes.py --test
      - name: Back up and configure clean URLs
        env:
          SSHPASS: ${{ secrets.ROOT_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=.github/ssh_known_hosts -o ConnectTimeout=20 root@116.196.73.207 'python3 -' < .github/scripts/configure_routes.py
      - name: Verify clean URLs and redirects
        run: |
          curl --fail --silent --show-error https://relaxpic.cn/download | grep 'Google Play' > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://relaxpic.cn/download.html)" = 301
          test "$(curl --silent --location --output /dev/null --write-out '%{url_effective}' https://relaxpic.cn/download.html)" = https://relaxpic.cn/download
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://relaxpic.cn/missing-route-for-check)" = 404
